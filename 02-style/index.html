<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>CSS 美化练习</title>
    <style>
      body {
        font-family: "Microsoft YaHei", sans-serif;
        background: #f5f7fa;
        margin: 0;
        padding: 40px;
      }
      h1 {
        color: #2c3e50;
        border-left: 6px solid #42b983;
        padding-left: 12px;
      }
      p {
        color: #555;
        line-height: 1.6;
      }
      .tag {
        display: inline-block;
        background: #42b983;
        color: white;
        padding: 2px 10px;
        border-radius: 12px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <h1>Hello，我是你的名字</h1>
    <p>这是我学 Web 开发的第一个网页。</p>
    <span class="tag">已完成第 01 篇</span>
  </body>
</html>
