<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>数组练习：把清单存进数据</title>
    <style>
      body {
        font-family: "Microsoft YaHei", sans-serif;
        background: #f5f7fa;
        margin: 0;
        padding: 40px;
      }
      h1 {
        color: #2c3e50;
        border-left: 6px solid #42b983;
        padding-left: 12px;
      }
      form {
        display: flex;
        gap: 8px;
        margin: 20px 0;
      }
      input {
        flex: 1;
        padding: 10px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 6px;
      }
      button {
        background: #42b983;
        color: white;
        border: none;
        padding: 10px 20px;
        font-size: 16px;
        border-radius: 6px;
        cursor: pointer;
      }
      button:hover {
        background: #369870;
      }
      #count {
        color: #888;
        font-size: 14px;
      }
      li {
        margin: 6px 0;
        color: #2c3e50;
      }
    </style>
  </head>
  <body>
    <h1>我的清单</h1>

    <form id="add-form">
      <input id="text-input" type="text" placeholder="请输入待办事项" />
      <button type="submit">添加</button>
    </form>

    <p id="count"></p>
    <ul id="list"></ul>

    <script>
      // 数据：清单的"真身"存在数组里，页面只是照它画出来
      const todos = ["买菜", "写作业"];

      const form = document.getElementById("add-form");
      const input = document.getElementById("text-input");
      const list = document.getElementById("list");
      const count = document.getElementById("count");

      // 渲染函数：照着 todos 数组，把页面重新画一遍
      function render() {
        // 先清空旧列表
        list.innerHTML = "";

        // 遍历数组，每一条生成一个 <li>
        todos.forEach(function (text) {
          const item = document.createElement("li");
          item.innerText = text;
          list.appendChild(item);
        });

        // 更新条数（数组长度）
        count.innerText = "共 " + todos.length + " 条";
      }

      form.addEventListener("submit", function (event) {
        event.preventDefault();

        const text = input.value.trim();
        if (text === "") {
          return;
        }

        // 只改数据：往数组末尾加一条
        todos.push(text);

        // 数据变了，重新画页面
        render();

        input.value = "";
        input.focus();
      });

      // 页面第一次打开时，先画一遍初始数据
      render();
    </script>
  </body>
</html>
